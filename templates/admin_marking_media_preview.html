<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ file_name }} - Video preview</title>
<style>
:root {
  color-scheme: light;
}

body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #1c2430;
  background: #ffffff;
  line-height: 1.45;
}

video {
  display: block;
  width: 100%;
  height: 100%;
  max-height: calc(100vh - 28px);
  background: #000;
  border-radius: 0;
  object-fit: contain;
}

.video-wrap {
  margin: 0;
  width: 100%;
  height: calc(100vh - 18px);
  min-height: 180px;
  background: #fff;
}
</style>
</head>
<body>
  <div class="video-wrap">
    <video id="media-video" controls playsinline preload="metadata">
      <source id="media-source" src="{{ media_url }}" type="{{ media_type }}">
      Your browser does not support the video element.
    </video>
  </div>

  <script>
  (() => {
    const mediaUrl = {{ media_url | tojson }};
    const convertedMediaUrl = {{ converted_media_url | default('', true) | tojson }};
    const video = document.getElementById('media-video');
    const source = document.getElementById('media-source');
    let attemptedFallback = false;

    function switchToFallback() {
      if (!convertedMediaUrl || attemptedFallback) {
        return;
      }

      attemptedFallback = true;
      source.src = convertedMediaUrl;
      source.type = 'video/mp4';
      video.load();
    }

    video.addEventListener('error', () => {
      switchToFallback();
    });

    if (!source.src) {
      source.src = mediaUrl;
      video.load();
    }
  })();
  </script>
</body>
</html>
