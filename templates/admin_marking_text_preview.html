<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ file_name }} - Text preview</title>
<style>
:root {
  color-scheme: light;
}

body {
  margin: 0;
  padding: 14px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #1c2430;
  background: #ffffff;
  line-height: 1.45;
}

h1 {
  margin: 0 0 8px;
  font-size: 1rem;
}

.meta {
  color: #52606d;
  font-size: 0.78rem;
  margin: 0 0 10px;
  overflow-wrap: anywhere;
}

.notice {
  border-left: 3px solid #2856a3;
  background: #f4f7fc;
  padding: 8px 10px;
  margin: 0 0 10px;
  font-size: 0.78rem;
  color: #1d3f7a;
}

pre {
  margin: 0;
  padding: 14px;
  border: 1px solid #cfd8e3;
  border-radius: 8px;
  background: #f9fbff;
  color: #102030;
  font: 0.82rem/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
  <h1>{{ file_name }}</h1>
  <div class="meta">{{ file_path }}</div>

  {% if truncated %}
  <div class="notice">Showing the first {{ max_bytes }} bytes.</div>
  {% else %}
  <div class="notice">Full text preview.</div>
  {% endif %}

  <pre>{{ content }}</pre>
</body>
</html>
